on: [push]

name: Dead code analysis

jobs:
  deadnix:
    name: Deadnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: deadnix
      # Inline instead of astro/deadnix-action: its inner
      # peter-evans/create-pull-request@v7 runs on deprecated Node 20.
      # opencloud.nix is excluded: deadnix falsely flags `lib` as unused
      # there and --edit would break the build.
      - run: nix run nixpkgs#deadnix -- --edit --exclude nixos/pegasus/services/opencloud.nix .
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: deadnix
          delete-branch: true
          title: 'Remove dead code'
          commit-message: 'Remove dead code'
          committer: 'GitHub <noreply@github.com>'
          body: |
            Automated dead code removal (deadnix).
